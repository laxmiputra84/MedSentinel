<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Plans - MedSentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black font-['Inter'] text-white">
    <header class="bg-black/40 backdrop-blur-xl sticky top-0 z-50 border-b border-white/10">
        <nav class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto">
            <a href="/" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="material-symbols-outlined text-white text-xl">health_and_safety</span>
                </div>
                <span class="text-2xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent font-['Manrope']">MedSentinel</span>
            </a>
            <div class="hidden md:flex space-x-2">
                <a href="/hospitals.html" class="px-4 py-2 text-gray-300 hover:text-white hover:bg-white/10 font-semibold rounded-lg transition-all">Hospitals</a>
                <a href="/schemes.html" class="px-4 py-2 text-gray-300 hover:text-white hover:bg-white/10 font-semibold rounded-lg transition-all">Schemes</a>
                <a href="/insurances.html" class="px-4 py-2 text-white bg-white/20 font-semibold rounded-lg transition-all">Insurance</a>
                <a href="/comparison.html" class="px-4 py-2 text-gray-300 hover:text-white hover:bg-white/10 font-semibold rounded-lg transition-all">Comparison</a>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/profile.html" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:scale-105 transition-all flex items-center space-x-2">
                    <span class="material-symbols-outlined text-lg">account_circle</span>
                    <span class="hidden sm:inline">Profile</span>
                </a>
                <button onclick="logout()" class="px-5 py-2.5 bg-red-600/80 hover:bg-red-700 text-white font-semibold rounded-lg hover:shadow-lg transition-all flex items-center space-x-2">
                    <span class="material-symbols-outlined text-lg">logout</span>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </nav>
    </header>

    <section class="relative pt-20 pb-12 px-6 bg-gradient-to-br from-blue-600 via-purple-600 to-pink-600">
        <div class="absolute top-0 right-0 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
        <div class="max-w-7xl mx-auto relative z-10">
            <h1 class="text-5xl md:text-6xl font-extrabold mb-6 font-['Manrope']">Insurance Plans</h1>
            <p class="text-xl opacity-90 max-w-2xl">Compare and find the best insurance plans for your healthcare needs</p>
        </div>
    </section>

    <section class="py-12 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- Filters Section -->
            <div class="bg-white/5 backdrop-blur-lg rounded-3xl p-8 border border-white/10 mb-12 shadow-2xl">
                <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <span class="material-symbols-outlined">tune</span> Filter Insurance Plans
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm font-semibold mb-2">Search Plans</label>
                        <input type="text" id="searchInput" placeholder="Search by name or provider..." 
                            class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Coverage Type</label>
                        <select id="coverageTypeFilter" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <option value="">All Types</option>
                            <option value="Comprehensive">Comprehensive</option>
                            <option value="Family">Family Floater</option>
                            <option value="Individual">Individual</option>
                            <option value="Budget">Budget Friendly</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Max Monthly Premium</label>
                        <input type="number" id="premiumFilter" placeholder="₹ Amount" 
                            class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Minimum Rating</label>
                        <select id="ratingFilter" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <option value="">All Ratings</option>
                            <option value="4.5">4.5 ⭐ & above</option>
                            <option value="4.7">4.7 ⭐ & above</option>
                        </select>
                    </div>
                </div>
                <div class="mt-6 flex gap-3">
                    <button onclick="applyFilters()" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all">
                        <span class="material-symbols-outlined inline mr-2">search</span> Search
                    </button>
                    <button onclick="resetFilters()" class="px-6 py-3 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-lg border border-white/20 transition-all">
                        Reset Filters
                    </button>
                </div>
            </div>

            <!-- Insurance Cards -->
            <div id="insuranceContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <div class="col-span-full flex justify-center items-center py-12">
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-12 h-12 mb-4 rounded-full bg-blue-500/20">
                            <span class="material-symbols-outlined text-blue-400">hourglass_empty</span>
                        </div>
                        <p class="text-gray-300">Loading insurance plans...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-black/40 backdrop-blur-xl border-t border-white/10 mt-20 py-12 px-6">
        <div class="max-w-7xl mx-auto text-center text-gray-400">
            <p>&copy; 2024 MedSentinel. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allInsurances = [];

        async function loadInsurances() {
            try {
                const response = await fetch('/api/insurances');
                allInsurances = await response.json();
                displayInsurances(allInsurances);
            } catch (error) {
                console.error('Error loading insurances:', error);
                document.getElementById('insuranceContainer').innerHTML = '<div class="col-span-full text-center text-red-400"><p>Failed to load insurance plans. Please try again later.</p></div>';
            }
        }

        function displayInsurances(insurances) {
            const container = document.getElementById('insuranceContainer');
            
            if (insurances.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-300">No insurance plans found matching your criteria.</p></div>';
                return;
            }

            container.innerHTML = insurances.map(insurance => `
                <div class="bg-white/5 backdrop-blur-lg rounded-3xl p-8 border border-white/10 shadow-2xl hover:shadow-3xl hover:border-white/20 transition-all duration-300 group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <h3 class="text-2xl font-bold mb-2 group-hover:text-blue-400 transition-all">${insurance.name}</h3>
                            <p class="text-blue-400 font-semibold">${insurance.provider}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-black text-yellow-400">${insurance.rating || 4.5}</div>
                            <p class="text-xs text-gray-400">Rating</p>
                        </div>
                    </div>

                    <div class="mb-6 pb-6 border-b border-white/10">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Coverage Amount</p>
                                <p class="text-2xl font-bold">₹${(insurance.coverage_amount / 100000).toFixed(1)}L</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Coverage Type</p>
                                <p class="text-lg font-semibold text-green-400">${insurance.coverage_type}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Monthly Premium</p>
                                <p class="text-2xl font-bold text-blue-400">₹${insurance.premium_monthly.toLocaleString()}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Annual Premium</p>
                                <p class="text-lg font-semibold">₹${insurance.premium_annual.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    <div class="mb-6">
                        <p class="text-xs font-semibold text-gray-300 mb-3">Key Features:</p>
                        <div class="flex flex-wrap gap-2">
                            ${insurance.features.split(',').slice(0, 3).map(f => `
                                <span class="px-3 py-1.5 bg-blue-500/20 border border-blue-400/30 rounded-full text-xs font-medium text-blue-300">
                                    ${f.trim()}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="viewInsuranceDetails(${insurance.id})" class="px-4 py-3 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-lg">info</span>
                            <span class="hidden sm:inline">Details</span>
                        </button>
                        <button onclick="openEnrollmentModal(${insurance.id}, '${insurance.name}')" class="px-4 py-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-lg">check_circle</span>
                            <span class="hidden sm:inline">Enroll</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const coverageType = document.getElementById('coverageTypeFilter').value;
            const maxPremium = parseFloat(document.getElementById('premiumFilter').value) || Infinity;
            const minRating = parseFloat(document.getElementById('ratingFilter').value) || 0;

            const filtered = allInsurances.filter(insurance => {
                const matchesSearch = insurance.name.toLowerCase().includes(search) || insurance.provider.toLowerCase().includes(search);
                const matchesCoverage = !coverageType || insurance.coverage_type.includes(coverageType);
                const matchesPremium = insurance.premium_monthly <= maxPremium;
                const matchesRating = !minRating || insurance.rating >= minRating;
                
                return matchesSearch && matchesCoverage && matchesPremium && matchesRating;
            });

            displayInsurances(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('coverageTypeFilter').value = '';
            document.getElementById('premiumFilter').value = '';
            document.getElementById('ratingFilter').value = '';
            displayInsurances(allInsurances);
        }

        function viewInsuranceDetails(insuranceId) {
            window.location.href = `/insurance-details.html?id=${insuranceId}`;
        }

        function openEnrollmentModal(insuranceId, insuranceName) {
            const userId = localStorage.getItem('userId');
            if (!userId) {
                alert('Please log in to enroll in an insurance plan.');
                window.location.href = '/login.html';
                return;
            }

            const policyNumber = 'POL' + Date.now();
            const coverageStart = new Date().toISOString().split('T')[0];
            const coverageEnd = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            const enrollment = {
                user_id: userId,
                insurance_id: insuranceId,
                policy_number: policyNumber,
                coverage_start_date: coverageStart,
                coverage_end_date: coverageEnd,
                sum_insured: 500000,
                dependents: 0
            };

            fetch('/api/user-insurances', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(enrollment)
            })
            .then(res => res.json())
            .then(data => {
                if (data.message) {
                    alert(`Successfully enrolled in ${insuranceName}!\nPolicy Number: ${policyNumber}`);
                    window.location.href = '/profile.html';
                } else {
                    alert('Enrollment failed. Please try again.');
                }
            })
            .catch(err => {
                console.error('Enrollment error:', err);
                alert('Error enrolling in insurance. Please try again.');
            });
        }

        function logout() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userName');
            window.location.href = '/login.html';
        }

        // Load insurances on page load
        loadInsurances();

        // Add event listeners for real-time search
        document.getElementById('searchInput').addEventListener('keyup', applyFilters);
        document.getElementById('coverageTypeFilter').addEventListener('change', applyFilters);
        document.getElementById('premiumFilter').addEventListener('change', applyFilters);
        document.getElementById('ratingFilter').addEventListener('change', applyFilters);
    </script>
</body>
</html>
