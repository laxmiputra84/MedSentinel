<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedSentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black font-['Inter'] text-white min-h-screen flex items-center justify-center">
    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo Section -->
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center space-x-3 mb-6">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="material-symbols-outlined text-white text-2xl">health_and_safety</span>
                </div>
                <span class="text-3xl font-black bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent font-['Manrope']">MedSentinel</span>
            </div>
            <p class="text-gray-400 text-sm">Affordable Healthcare at Your Fingertips</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 p-8 shadow-2xl">
            <!-- Tabs -->
            <div class="flex gap-2 mb-8 bg-white/5 rounded-xl p-1">
                <button id="loginTab" class="flex-1 py-2.5 px-4 rounded-lg font-semibold transition-all bg-blue-600 text-white">
                    Login
                </button>
                <button id="signupTab" class="flex-1 py-2.5 px-4 rounded-lg font-semibold transition-all text-gray-400 hover:text-white">
                    Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Email or Phone</label>
                    <input type="text" id="loginEmail" placeholder="Enter your email or phone" required 
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required 
                            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                        <button type="button" class="absolute right-3 top-3.5 text-gray-400 hover:text-white" onclick="toggleLoginPassword()">
                            <span class="material-symbols-outlined text-xl" id="loginPasswordIcon">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-white/10 border-white/20 cursor-pointer">
                        <span class="text-gray-400">Remember me</span>
                    </label>
                    <a href="#" class="text-blue-400 hover:text-blue-300 transition-all">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-blue-500/50 transition-all transform hover:scale-105 mt-6">
                    Login
                </button>

                <div id="loginError" class="hidden p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm"></div>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="space-y-4 hidden" onsubmit="handleSignup(event)">
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required 
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required 
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Phone</label>
                    <input type="tel" id="signupPhone" placeholder="Enter your phone number" required 
                        class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="signupPassword" placeholder="Create a password" required 
                            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg focus:outline-none focus:border-blue-500 focus:bg-white/15 transition-all text-white placeholder-gray-500">
                        <button type="button" class="absolute right-3 top-3.5 text-gray-400 hover:text-white" onclick="toggleSignupPassword()">
                            <span class="material-symbols-outlined text-xl" id="signupPasswordIcon">visibility_off</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-start space-x-2 text-sm">
                    <input type="checkbox" id="agreeTerms" required class="w-4 h-4 rounded bg-white/10 border-white/20 cursor-pointer mt-0.5">
                    <label class="text-gray-400 cursor-pointer">
                        I agree to the <a href="#" class="text-blue-400 hover:text-blue-300">Terms & Conditions</a> and <a href="#" class="text-blue-400 hover:text-blue-300">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold rounded-lg hover:shadow-lg hover:shadow-blue-500/50 transition-all transform hover:scale-105 mt-6">
                    Create Account
                </button>

                <div id="signupError" class="hidden p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm"></div>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/10"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-gradient-to-br from-gray-900 via-gray-800 to-black text-gray-400">Or continue with</span>
                </div>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" class="py-2.5 px-4 bg-white/10 hover:bg-white/15 border border-white/20 rounded-lg transition-all flex items-center justify-center space-x-2 text-sm font-semibold">
                    <span class="text-lg">🔵</span>
                    <span>Google</span>
                </button>
                <button type="button" class="py-2.5 px-4 bg-white/10 hover:bg-white/15 border border-white/20 rounded-lg transition-all flex items-center justify-center space-x-2 text-sm font-semibold">
                    <span class="text-lg">📱</span>
                    <span>Phone</span>
                </button>
            </div>

            <!-- Footer -->
            <p class="text-center text-gray-400 text-sm mt-6">
                By logging in, you agree to MedSentinel's <a href="#" class="text-blue-400 hover:text-blue-300">Terms of Service</a>
            </p>
        </div>

        <!-- Security Badge -->
        <div class="mt-6 flex items-center justify-center space-x-2 text-gray-400 text-sm">
            <span class="material-symbols-outlined text-lg">security</span>
            <span>256-bit SSL Encrypted</span>
        </div>
    </div>

    <script>
        // Tab switching
        document.getElementById('loginTab').addEventListener('click', () => {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginTab').classList.add('bg-blue-600', 'text-white');
            document.getElementById('loginTab').classList.remove('text-gray-400', 'hover:text-white');
            document.getElementById('signupTab').classList.remove('bg-blue-600', 'text-white');
            document.getElementById('signupTab').classList.add('text-gray-400', 'hover:text-white');
        });

        document.getElementById('signupTab').addEventListener('click', () => {
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupTab').classList.add('bg-blue-600', 'text-white');
            document.getElementById('signupTab').classList.remove('text-gray-400', 'hover:text-white');
            document.getElementById('loginTab').classList.remove('bg-blue-600', 'text-white');
            document.getElementById('loginTab').classList.add('text-gray-400', 'hover:text-white');
        });

        // Password visibility toggle
        function toggleLoginPassword() {
            const input = document.getElementById('loginPassword');
            const icon = document.getElementById('loginPasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        function toggleSignupPassword() {
            const input = document.getElementById('signupPassword');
            const icon = document.getElementById('signupPasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const button = event.target.querySelector('button[type="submit"]');

            button.disabled = true;
            button.textContent = 'Logging in...';
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('loggedIn', 'true');
                    window.location.href = '/index.html';
                } else {
                    errorDiv.textContent = data.message || 'Invalid email or password';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        }

        // Signup handler
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const errorDiv = document.getElementById('signupError');
            const button = event.target.querySelector('button[type="submit"]');

            button.disabled = true;
            button.textContent = 'Creating Account...';
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, phone, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('loggedIn', 'true');
                    window.location.href = '/index.html';
                } else {
                    errorDiv.textContent = data.message || 'Failed to create account. Please try again.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
            } finally {
                button.disabled = false;
                button.textContent = 'Create Account';
            }
        }

        // Demo login for testing
        window.addEventListener('load', () => {
            console.log('Login page loaded');
        });
    </script>
</body>
</html>
