version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medsentinel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: medsentinel
      MYSQL_USER: medsentinel_user
      MYSQL_PASSWORD: medsentinel_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medsentinel_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medsentinel_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - DATABASE_URL=mysql+pymysql://medsentinel_user:medsentinel_password@mysql:3306/medsentinel
      - TEST_DATABASE_URL=mysql+pymysql://medsentinel_user:medsentinel_password@mysql:3306/medsentinel_test
      - JWT_SECRET_KEY=medsentinel_production_super_secret_jwt_key_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAG_ENABLED=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medsentinel_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  mysql_data:
    driver: local
  qdrant_data:
    driver: local
